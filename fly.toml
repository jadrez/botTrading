app = "trading-lijuflow"
primary_region = "dfw"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 1, not 0: the Experimento XAU/USD pyramid now runs as a 24/7 background
  # loop inside server.mjs (server-exp-engine.mjs) — a machine idled by
  # auto_stop_machines would freeze that loop along with the HTTP server.
  # Costs ~$3.50-4.50/mo extra for the one always-on machine (shared-cpu-1x,
  # 512mb, dfw) — explicitly approved given that trade-off.
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
